[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-research"
version = "0.1.0"
description = "Local desktop research library with traceable PDF extraction"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24,<2", "httpx>=0.27,<1", "pydantic>=2.8,<3", "python-dotenv>=1,<2", "filelock>=3,<5", "PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<6"]

[project.scripts]
folio = "folio.cli:main"
folio-desktop = "folio.desktop:main"

[tool.setuptools.package-data]
folio = ["prompts/*.md", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["folio*"]
