name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-windows.txt
          python -m pip install --no-deps .
      - name: Test
        run: |
          python -m pip install pytest reportlab
          python -m pytest tests -q
      - name: Build
        run: pyinstaller packaging/folio.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: FolioDeepthinking-windows-x64
          path: dist/FolioDeepthinking.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FolioDeepthinking.exe
